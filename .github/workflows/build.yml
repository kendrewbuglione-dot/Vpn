name: Build Android VPN APK

on:
  push:
    branches: [ "main", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка окружения Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Загрузка NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Сборка vpncore.aar через gomobile
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          export GOTOOLCHAIN=local
          go clean -modcache
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          gomobile bind -target=android -androidapi 21 -o android/app/libs/vpncore.aar ./...
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

          mkdir -p android/app/libs
          cd native/vpncore
          go get golang.org/x/mobile/cmd/gomobile@latest
          go mod tidy
          gomobile bind -target=android -androidapi=26 -ldflags="-s -w" -o ../../android/app/libs/vpncore.aar .

      - name: Сборка релизного APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Выгрузка APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: vpn-aggregator-apk
          path: build/app/outputs/flutter-apk/*.apk
