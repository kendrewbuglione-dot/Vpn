name: Build Android VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка окружения Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Сборка vpncore.aar через gomobile
        run: |
          
          export GOTOOLCHAIN=auto
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p android/app/libs
          cd native/vpncore
          go get golang.org/x/mobile@latest
          gomobile bind -target=android -androidapi 21 -o ../../android/app/libs/vpncore.aar .
          cd ../..

      - name: Сборка релизного APK
        run: |
          flutter create . --project-name vpn --platforms=android --org com.kandrew.vpn || true
          sed -i "s/package=\"com.example.vpn\"//g" android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          bash patch_manifest.sh || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          flutter pub get
          rm -rf test

          flutter analyze --no-fatal-warnings --no-fatal-infos || true
          flutter test || true
          sed -i "s/ package=\"[^\"]*\"//g" android/app/src/main/AndroidManifest.xml
          flutter build apk --release

      - name: Выгрузка APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: vpn-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
