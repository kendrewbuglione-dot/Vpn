name: Flutter Analyze

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/vpn-orchestrator

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: stable
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze
